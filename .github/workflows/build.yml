name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew build
      - name: Publish 26.3 build
        if: github.ref == 'refs/heads/port-26.3' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: build-${{ github.run_id }}
        run: |
          jar=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$jar"
          gh release create "$RELEASE_TAG" "$jar" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Minecraft 26.3 build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from commit ${GITHUB_SHA}."
          echo "url=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_OUTPUT"
      - name: Comment on upstream PR
        if: github.ref == 'refs/heads/port-26.3' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.UPSTREAM_PR_TOKEN }}
          script: |
            const marker = '<!-- nbttooltip-26.3-build -->';
            const body = `${marker}\nAutomated Minecraft 26.3 build for commit \`${context.sha}\`.\n\n[Download the build](${{ steps.release.outputs.url }})`;
            const { owner, repo } = { owner: 'zabi94', repo: 'NBTTooltip' };
            const issue_number = 65;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
