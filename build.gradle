plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    maven {
        name = "CurseForge"
        url = "https://minecraft.curseforge.com/api/maven/"
    }
    maven {
    	name = "ModMenu"
    	url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
    	name = "Cloth+REI"
    	url = "https://maven.shedaniel.me/"
    }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	

	// Deps
	implementation("com.terraformersmc:modmenu:${project.modmenu_version}")  {
      exclude module: 'fabric-api'
      exclude module: 'config-2'
      exclude module: 'cloth-config-fabric'
      exclude module: 'roughlyenoughitems-api'
    }
    
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}") {
      exclude module: 'fabric-api'
      exclude module: 'config-2'
      exclude module: 'cloth-config-fabric'
      exclude module: 'roughlyenoughitems-api'
    }
    
	// //Bundling
	include "me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach  {
	it.options.release = 25
}


java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
		from components.java
		}
	}

	repositories {
	}
}
